<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack - Manajemen Keuangan Pribadi</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #030712 !important;
        color: #ffffff;
      }
      html.light, html.light body {
        background-color: #f9fafb !important;
        color: #000000;
      }
    </style>
    <script>
      (function () {
        try {
          const settings = JSON.parse(localStorage.getItem('fintrack_settings') || '{}');
          const mode = settings?.theme?.mode || 'dark';
          document.documentElement.classList.add(mode);
          if (settings?.theme?.accentColor) {
            document.documentElement.style.setProperty('--accent', settings.theme.accentColor);
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
